# Downtime monitor targets for health-monitor.sh. Install as /root/health-monitor.conf on the
# PRODUCTION server (157.180.126.72).
#
# Columns: name kind target port path      kind = http | pg
# `target` is the Coolify application/database UUID; the monitor matches it as a container-name
# prefix, so it survives redeploys.
#
# projection-postgres is monitored; the projection-service app is still not. That asymmetry is
# deliberate and worth understanding before you change it. This file used to say the service was
# stopped in production, so a row would alert every two minutes — but on 2026-08-30 the container
# was found up and healthy, which is the condition the old note said to add it under. Whether it
# is *meant* to run here is undecided (fantasy-bff#105), and monitoring an app that may be
# switched off on purpose would turn a deliberate stop into an alert every two minutes. Its
# database has no such ambiguity: it exists, it holds data, and losing it would be silent.
# Add the service row once someone decides it belongs here.
